[package]
name = "runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
runtime-diagnostics = ["dep:diagnostics", "dep:rollout-trace"]

[dependencies]
config = { workspace = true }
diagnostics = { workspace = true, optional = true }
exec-server = { workspace = true }
rollout = { workspace = true }
rollout-trace = { workspace = true, optional = true }
runtime-protocol = { workspace = true }
shell-command = { workspace = true }
state = { workspace = true }
thread-store = { workspace = true }
utils-absolute-path = { workspace = true }
utils-output-truncation = { workspace = true }
utils-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "runtime_core"
path = "src/lib.rs"
doctest = false
