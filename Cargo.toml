[workspace]
members = [
    "crates/diagnostics",
    "crates/rollout-trace",
    "crates/response-debug-context",
    "crates/install-context",
    "crates/state",
    "crates/rollout",
    "crates/thread-store",
    "crates/agent-graph-store",
    "crates/ansi-escape",
    "crates/exec",
    "crates/exec-server",
    "crates/shell-command",
    "crates/runtime-protocol",
    "crates/app-protocol",
    "crates/model-provider-info",
    "crates/config",
    "crates/runtime-core",
    "crates/utils/json-to-toml",
    "crates/utils/home-dir",
    "crates/utils/absolute-path",
    "crates/utils/path-utils",
    "crates/utils/string",
    "crates/utils/image",
    "crates/utils/output-truncation",
    "crates/utils/pty",
    "crates/utils/approval-presets",
    "crates/utils/sandbox-summary",
    "crates/async-utils",
    "crates/experimental-api-macros",
    "crates/execpolicy",
    "crates/features",
    "crates/file-system",
    "crates/file-search",
    "crates/file-watcher",
    "crates/git-utils",
    "crates/process-hardening",
    "crates/execpolicy-legacy",
    "crates/sandboxing",
    "crates/linux-sandbox",
    "crates/network-proxy",
    "crates/windows-sandbox-rs",
    "crates/otel-shim",
    "crates/utils/cache",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
app-protocol = { path = "crates/app-protocol" }
async-utils = { path = "crates/async-utils" }
ansi-escape = { path = "crates/ansi-escape" }
config = { path = "crates/config" }
diagnostics = { path = "crates/diagnostics" }
exec = { path = "crates/exec" }
exec-server = { path = "crates/exec-server" }
execpolicy = { path = "crates/execpolicy" }
execpolicy-legacy = { package = "sprite-execpolicy-legacy", path = "crates/execpolicy-legacy" }
features = { path = "crates/features" }
file-system = { path = "crates/file-system" }
file-search = { path = "crates/file-search" }
file-watcher = { path = "crates/file-watcher" }
git-utils = { path = "crates/git-utils" }
install-context = { path = "crates/install-context" }
model-provider-info = { path = "crates/model-provider-info" }
network-proxy = { path = "crates/network-proxy" }
process-hardening = { package = "sprite-process-hardening", path = "crates/process-hardening" }
experimental-api-macros = { path = "crates/experimental-api-macros" }
agent-graph-store = { path = "crates/agent-graph-store" }
runtime-core = { path = "crates/runtime-core" }
runtime-protocol = { path = "crates/runtime-protocol" }
rollout = { path = "crates/rollout" }
rollout-trace = { path = "crates/rollout-trace" }
response-debug-context = { path = "crates/response-debug-context" }
sandboxing = { package = "sprite-sandboxing", path = "crates/sandboxing" }
shell-command = { path = "crates/shell-command" }
state = { path = "crates/state" }
thread-store = { path = "crates/thread-store" }
utils-absolute-path = { path = "crates/utils/absolute-path" }
utils-cache = { path = "crates/utils/cache" }
utils-approval-presets = { path = "crates/utils/approval-presets" }
utils-home-dir = { path = "crates/utils/home-dir" }
utils-image = { path = "crates/utils/image" }
utils-json-to-toml = { path = "crates/utils/json-to-toml" }
utils-output-truncation = { path = "crates/utils/output-truncation" }
utils-path = { path = "crates/utils/path-utils" }
utils-pty = { path = "crates/utils/pty" }
utils-sandbox-summary = { path = "crates/utils/sandbox-summary" }
utils-string = { path = "crates/utils/string" }
windows-sandbox = { package = "sprite-windows-sandbox", path = "crates/windows-sandbox-rs" }

ansi-to-tui = "7.0.0"
anyhow = "1"
arc-swap = "1.9.0"
async-trait = "0.1.89"
allocative = "=0.3.4"
base64 = "0.22.1"
bytes = "1.10.1"
chardetng = "0.1.17"
chrono = "0.4.43"
clap = "4"
crossbeam-channel = "0.5.15"
derive_more = "=2.0.1"
dirs = "6"
dns-lookup = "2.1.1"
dunce = "1.0.4"
encoding_rs = "0.8.35"
env_logger = "=0.11.9"
futures = "0.3.31"
gethostname = "1.1.0"
glob = "=0.3.3"
globset = "0.4"
http = "1.3.1"
ignore = "0.4.23"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
image = { version = "^0.25.9", default-features = false }
indexmap = "2.12.1"
inventory = "0.3.19"
libc = "0.2.178"
lazy_static = "1"
landlock = "=0.4.4"
log = "0.4"
lru = "0.16.3"
maplit = "1.0.2"
mime_guess = "2.0.5"
multimap = "0.10.1"
notify = "8.2.0"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }
once_cell = "1.20.2"
owo-colors = "4"
portable-pty = "0.9.0"
pretty_assertions = "1.4.1"
opentelemetry = "0.31.0"
opentelemetry-appender-tracing = "0.31.0"
opentelemetry-otlp = "0.31.0"
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry_sdk = "0.31.0"
os_info = "3.12.0"
path-absolutize = "=3.1.1"
proc-macro2 = "1"
prost = "0.14.3"
quick-xml = { version = "0.38.4", features = ["serialize"] }
quote = "1"
rand = "0.9"
ratatui = "0.29.0"
regex-lite = "0.1.8"
regex = "1"
reqwest = { version = "0.12", features = ["cookies"] }
rmcp = { version = "1.7.0", default-features = false }
schemars = "0.8.22"
seccompiler = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
serde_path_to_error = "0.1.20"
serde_with = "3.17"
sha1 = "0.10.6"
sha2 = "0.10.9"
shlex = "1.3.0"
similar = "2.7.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
starlark = "=0.13.0"
strum = "0.27.2"
strum_macros = "0.28.0"
syn = { version = "2", features = ["full", "extra-traits"] }
sys-locale = "0.3.2"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = "0.3"
tokio = "1"
tokio-stream = "0.1.17"
tokio-util = "0.7.18"
toml = "0.9.8"
toml_edit = "0.23.7"
tonic = "0.14.2"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
tracing = "0.1.44"
tracing-appender = "=0.2.3"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = "0.3.22"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
ts-rs = "11"
url = "2"
uuid = "1"
walkdir = "2.5.0"
wildmatch = "2.6.1"
which = "8"
windows = "=0.58.0"
winapi-util = "0.1.11"
windows-sys = "0.52"
zstd = "0.13"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
