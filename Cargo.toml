[workspace]
members = [
    "crates/runtime-protocol",
    "crates/app-protocol",
]
exclude = [
    "crates/utils/absolute-path",
    "crates/utils/string",
    "crates/utils/image",
    "crates/async-utils",
    "crates/experimental-api-macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
app-protocol = { path = "crates/app-protocol" }
async-utils = { path = "crates/async-utils" }
experimental-api-macros = { path = "crates/experimental-api-macros" }
runtime-protocol = { path = "crates/runtime-protocol" }
utils-absolute-path = { path = "crates/utils/absolute-path" }
utils-image = { path = "crates/utils/image" }
utils-string = { path = "crates/utils/string" }

anyhow = "1"
async-trait = "0.1.89"
base64 = "0.22.1"
chardetng = "0.1.17"
chrono = "0.4.43"
clap = "4"
dirs = "6"
dunce = "1.0.4"
encoding_rs = "0.8.35"
globset = "0.4"
http = "1.3.1"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
image = { version = "^0.25.9", default-features = false }
inventory = "0.3.19"
mime_guess = "2.0.5"
pretty_assertions = "1.4.1"
proc-macro2 = "1"
quick-xml = { version = "0.38.4", features = ["serialize"] }
quote = "1"
regex-lite = "0.1.8"
reqwest = { version = "0.12", features = ["cookies"] }
rmcp = { version = "1.7.0", default-features = false }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.17"
shlex = "1.3.0"
similar = "2.7.0"
strum = "0.27.2"
strum_macros = "0.28.0"
syn = { version = "2", features = ["full", "extra-traits"] }
sys-locale = "0.3.2"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = "1"
tokio-util = "0.7.18"
tracing = "0.1.44"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
ts-rs = "11"
uuid = "1"
wildmatch = "2.6.1"
which = "8"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
